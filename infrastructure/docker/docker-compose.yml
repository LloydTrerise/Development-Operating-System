services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devos
      POSTGRES_PASSWORD: devos
      POSTGRES_DB: devos
    ports:
      - '5432:5432'
    volumes:
      - devos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devos -d devos']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devos-postgres-data:
